<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Process — The Corridor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cam{position:absolute;inset:0;transform-origin:720px 410px;transition:transform 1.6s cubic-bezier(.65,0,.35,1)}
.face{position:absolute;box-sizing:border-box}
.edge{position:absolute;box-sizing:border-box;border:1px solid rgba(242,235,227,0.26);box-shadow:inset 0 14px 22px -14px rgba(0,0,0,0.85);transition:opacity .9s ease}
.ring{transition:opacity .9s ease}
.lab{position:absolute;margin:0;text-align:center;font-family:'Inter',sans-serif;font-weight:500;text-transform:uppercase;white-space:nowrap;line-height:1;color:#F2EBE3;transition:opacity .9s ease}
.lab i{font-style:normal;color:#B98550}
.phr{position:absolute;margin:0;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-style:italic;white-space:nowrap;line-height:1;color:#F2EBE3;transition:opacity .9s ease}
.walk{all:unset;position:absolute;left:230px;top:120px;width:980px;height:700px;cursor:pointer}
.walk:focus-visible{outline:2px solid #B98550;outline-offset:6px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid transparent}
.tab:hover{color:#F2EBE3 !important}
.tab:focus-visible{outline:2px solid #B98550;outline-offset:4px}
@keyframes breathe{0%,100%{box-shadow:0 0 70px 10px rgba(185,133,80,0.26)}50%{box-shadow:0 0 90px 16px rgba(185,133,80,0.36)}}
.end{animation:breathe 4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion: reduce){.end,.rise{animation:none}.cam,.lab,.phr{transition:none}}
</style>
</helmet>
<div id="process" style="width: 1440px; height: 1000px; position: relative; overflow: hidden; background: #14110E; color: #F2EBE3; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif">

  <div class="cam" aria-hidden="true" style="transform: scale({{ cam }})">
    <svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" style="position: absolute; left: 0; top: 0">
      <defs>
        <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#B98550" stop-opacity="0.13"></stop>
          <stop offset="1" stop-color="#B98550" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <path d="M0 0 L230 120 M1440 0 L1210 120 M0 1000 L230 820 M1440 1000 L1210 820" stroke="rgba(242,235,227,0.09)"></path>
      <path d="M230 820 L1210 820 L1440 1000 L0 1000 Z" fill="url(#spill)"></path>
      <path d="M720 828 L720 1000" stroke="#B98550" stroke-opacity="0.45"></path>
    </svg>

    <div class="face ring" style="left: 230px; top: 120px; width: 980px; height: 700px; opacity: {{ d1 }}; background: radial-gradient(ellipse 62% 60% at 490px 290px, rgba(185,133,80,0.075), rgba(185,133,80,0) 72%), #17130F"></div>
    <div class="face ring" style="left: 400px; top: 210px; width: 640px; height: 460px; opacity: {{ d2 }}; background: radial-gradient(ellipse 60% 60% at 320px 200px, rgba(185,133,80,0.11), rgba(185,133,80,0) 74%), #1A1511"></div>
    <div class="face ring" style="left: 520px; top: 275px; width: 400px; height: 290px; opacity: {{ d3 }}; background: radial-gradient(ellipse 60% 62% at 200px 135px, rgba(185,133,80,0.16), rgba(185,133,80,0) 76%), #1E1813"></div>
    <svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" stroke="rgba(242,235,227,0.08)" style="position: absolute; left: 0; top: 0">
      <path class="ring" d="M230 120 L400 210 M1210 120 L1040 210 M230 820 L400 670 M1210 820 L1040 670" style="opacity: {{ d1 }}"></path>
      <path class="ring" d="M400 210 L520 275 M1040 210 L920 275 M400 670 L520 565 M1040 670 L920 565" style="opacity: {{ d2 }}"></path>
      <path class="ring" d="M520 275 L605 325 M920 275 L835 325 M520 565 L605 495 M920 565 L835 495" style="opacity: {{ d3 }}"></path>
    </svg>
    <div class="edge" style="left: 230px; top: 120px; width: 980px; height: 700px; border-color: rgba(242,235,227,0.36); box-shadow: none; opacity: {{ e1 }}"></div>
    <div class="edge" style="left: 400px; top: 210px; width: 640px; height: 460px; opacity: {{ e2 }}"></div>
    <div class="edge" style="left: 520px; top: 275px; width: 400px; height: 290px; opacity: {{ e3 }}"></div>
    <div class="end" style="position: absolute; left: 605px; top: 325px; width: 230px; height: 170px; border: 1px solid #B98550; overflow: hidden; background: #2B2A28">
      <img src="/_blob/229c64cbf7ab99c4506a4d6ca901dcae" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
    </div>

    <p class="lab" style="left: 230px; width: 980px; top: 159px; font-size: 13px; letter-spacing: 0.34em; opacity: {{ t1 }}"><i>01</i> — Groundwork</p>
    <p class="phr" style="left: 230px; width: 980px; top: 728px; font-size: 34px; opacity: {{ t1 }}">Your style, your content, your vision.</p>

    <p class="lab" style="left: 400px; width: 640px; top: 237px; font-size: 10px; letter-spacing: 0.32em; opacity: {{ t2 }}"><i>02</i> — Planning</p>
    <p class="phr" style="left: 400px; width: 640px; top: 605px; font-size: 24px; opacity: {{ t2 }}">Milestones and deadlines, agreed.</p>

    <p class="lab" style="left: 520px; width: 400px; top: 296px; font-size: 8px; letter-spacing: 0.3em; opacity: {{ t3 }}"><i>03</i> — Production</p>
    <p class="phr" style="left: 520px; width: 400px; top: 528px; font-size: 16px; opacity: {{ t3 }}">One line of code at a time.</p>

    <p class="lab" style="left: 520px; width: 400px; top: 504px; font-size: 7px; letter-spacing: 0.3em; color: #B98550">04 — Project complete</p>
  </div>

  <button class="walk" type="button" aria-label="{{ walkLabel }}" onClick="{{ next }}"></button>

  <p style="position: absolute; left: 64px; top: 46px; margin: 0; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(242,235,227,0.75)">Process</p>
  <h2 style="position: absolute; left: 64px; top: 66px; margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-style: italic; font-size: 34px; line-height: 1.1">How we build your site.</h2>

  <div class="rise" key="{{ cur.no }}" aria-live="polite" style="position: absolute; left: 64px; top: 846px; width: 640px">
    <h3 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: 44px; line-height: 1">{{ cur.no }} <span style="color: #B98550">—</span> {{ cur.title }}</h3>
    <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: rgba(242,235,227,0.78)">{{ cur.body }}</p>
  </div>

  <div role="group" aria-label="Stages" style="position: absolute; right: 64px; top: 848px; display: flex; gap: 22px">
    <sc-for list="{{ stages }}" as="st" hint-placeholder-count="4">
      <button class="tab" type="button" onClick="{{ st.pick }}" aria-pressed="{{ st.on }}" style="color: {{ st.color }}; border-bottom-color: {{ st.line }}">{{ st.label }}</button>
    </sc-for>
  </div>
  <p style="position: absolute; right: 64px; top: 912px; margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 20px; color: rgba(242,235,227,0.6)">Click the doorway to walk through.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { no: "01", title: "Groundwork", short: "Groundwork",
        body: "First, we discuss the style and content you want and get an understanding of your vision for the site. Then we outline the process going forward." },
      { no: "02", title: "Planning", short: "Planning",
        body: "Once we know what you want, we work out a development roadmap. With the milestones and deadlines agreed, we send the plan over to make sure you’re happy with it." },
      { no: "03", title: "Production", short: "Production",
        body: "Connor builds your website from the ground up, one line of code at a time. Meanwhile, Mike crafts your brand copy so it’s ready to greet the online world." },
      { no: "04", title: "Project complete", short: "Complete",
        body: "Happy with the final product? It’s all yours once we receive the final payment, with the option of ongoing support like hosting, maintenance or domain setup." }
    ];
    const s = this.state || {};
    const i = s.i ?? 0;
    const go = (k) => this.setState({ i: k });
    // camera: scale about the lit door so threshold i fills the view
    const cams = [1, 1.45, 2.2, 3.4];
    // the threshold you stand at reads at full strength, those ahead wait in half-light, those behind fall away
    const text = (r) => (r === i ? 1 : r > i ? 0.5 : 0);
    return {
      cur: data[i],
      cam: cams[i],
      t1: text(0), t2: text(1), t3: text(2),
      e1: i === 0 ? 1 : 0, e2: i <= 1 ? 1 : 0, e3: i <= 2 ? 1 : 0,
      d1: i === 0 ? 1 : 0, d2: i <= 1 ? 1 : 0, d3: i <= 2 ? 1 : 0,
      next: () => go((i + 1) % 4),
      walkLabel: i < 3 ? `Walk through to stage ${data[i + 1].no}, ${data[i + 1].title}` : "Back to the first door",
      stages: data.map((d, k) => ({
        ...d,
        on: k === i,
        label: d.no + " " + d.short,
        color: k === i ? "#B98550" : "rgba(242,235,227,0.6)",
        line: k === i ? "#B98550" : "transparent",
        pick: () => go(k)
      }))
    };
  }
}
</script>
</body>
</html>
