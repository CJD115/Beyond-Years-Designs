<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Process — The Corridor (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2EBE3;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #B98550;outline-offset:3px}
.lbl{margin:0;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,235,227,.75)}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.cta{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:500;border-bottom:1px solid rgba(242,235,227,.5)}
.arrow{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:48px;border:1px solid rgba(242,235,227,.35);display:inline-flex;align-items:center;justify-content:center;color:#F2EBE3;flex:none}
.num{all:unset;box-sizing:border-box;cursor:pointer;min-width:48px;height:48px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;border-bottom:1px solid transparent}
.fr{position:absolute;box-sizing:border-box;border:1px solid;transition:border-color 1.2s}
.fl{position:absolute;font-size:12px;letter-spacing:.2em;white-space:nowrap}
.world{position:absolute;inset:0;transform-origin:171px 170px;transition:transform 1.6s cubic-bezier(.65,0,.35,1)}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
.end{animation:breathe 4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.22,1,.36,1) .3s both}
.num:hover,.arrow:hover{color:#B98550}
@media (prefers-reduced-motion: reduce){.end,.rise{animation:none}.world,.fr{transition:none}}
</style>
</helmet>
<div id="process" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #14110E; color: #F2EBE3; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif">
  <p class="lbl" style="position: absolute; left: 24px; top: 40px">Process</p>
  <h2 class="serif" style="position: absolute; left: 24px; top: 60px; margin: 0; font-weight: 300; font-style: italic; font-size: 28px; line-height: 1.1">How we build your site.</h2>

  <div aria-hidden="true" onTouchStart="{{ ts }}" onTouchEnd="{{ te }}" style="position: absolute; left: 24px; top: 116px; width: 342px; height: 400px; overflow: hidden">
    <div class="world" style="transform: scale({{ scale }})">
      <svg width="342" height="400" viewBox="0 0 342 400" fill="none" style="position: absolute; left: 0; top: 0">
        <path d="M0 0 L125 124 M342 0 L217 124 M0 400 L125 232 M342 400 L217 232" stroke="rgba(242,235,227,0.08)"></path>
        <path d="M125 232 L217 232 L342 400 L0 400 Z" fill="rgba(242,235,227,0.035)"></path>
        <path d="M125 232 L217 232 L280 340 L62 340 Z" fill="rgba(242,235,227,0.03)"></path>
      </svg>
      <div class="fr" style="left: 0; top: 0; width: 342px; height: 400px; border-color: {{ f0 }}"></div>
      <span class="fl" style="left: 12px; top: 12px; color: {{ f0 }}">01</span>
      <div class="fr" style="left: 58px; top: 58px; width: 226px; height: 264px; border-color: {{ f1 }}"></div>
      <span class="fl" style="left: 68px; top: 68px; color: {{ f1 }}">02</span>
      <div class="fr" style="left: 97px; top: 97px; width: 147px; height: 172px; border-color: {{ f2 }}"></div>
      <span class="fl" style="left: 104px; top: 104px; font-size: 12px; color: {{ f2 }}">03</span>
      <div class="end" style="position: absolute; left: 125px; top: 124px; width: 92px; height: 108px; border: 1px solid #B98550; box-sizing: border-box; box-shadow: 0 0 40px 4px rgba(185,133,80,0.28); overflow: hidden; background: #2B2A28">
        <img src="/_blob/229c64cbf7ab99c4506a4d6ca901dcae" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; display: block">
      </div>
    </div>
  </div>

  <div class="rise" key="{{ cur.no }}" aria-live="polite" style="position: absolute; left: 24px; right: 24px; top: 540px">
    <h3 class="serif" style="margin: 0; font-weight: 300; font-size: 36px; line-height: 1">{{ cur.no }} <span style="color: #B98550">—</span> {{ cur.title }}</h3>
    <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.65; color: rgba(242,235,227,0.8)">{{ cur.body }}</p>
  </div>

  <nav aria-label="Stages" style="position: absolute; left: 24px; right: 24px; top: 772px; display: flex; align-items: center; justify-content: space-between">
    <button class="arrow" type="button" aria-label="Previous door" onClick="{{ prev }}"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M17 6H1M6 1L1 6l5 5"></path></svg></button>
    <div style="display: flex; gap: 2px">
      <sc-for list="{{ stages }}" as="st" hint-placeholder-count="4">
        <button class="num" type="button" onClick="{{ st.pick }}" aria-pressed="{{ st.active }}" aria-label="{{ st.aria }}" style="color: {{ st.color }}; border-bottom-color: {{ st.line }}">{{ st.no }}</button>
      </sc-for>
    </div>
    <button class="arrow" type="button" aria-label="Next door" onClick="{{ next }}"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M1 6h16M12 1l5 5-5 5"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { no: "01", title: "Groundwork", body: "First, we discuss the style and content you want and get an understanding of your vision for the site." },
      { no: "02", title: "Planning", body: "We work out a development roadmap, agree the milestones and deadlines, and send the plan over to make sure you’re happy with it." },
      { no: "03", title: "Production", body: "Connor builds your website from the ground up, one line of code at a time. Meanwhile, Mike crafts your brand copy." },
      { no: "04", title: "Project complete", body: "Happy with the final product? It’s all yours once the final payment is in." }
    ];
    const sizes = [1, 0.66, 0.43, 0.27];
    const s = this.state || {};
    const i = s.i ?? 0;
    const n = data.length;
    const go = (k) => this.setState({ i: Math.max(0, Math.min(n - 1, k)) });
    const fc = (k) => k === i ? "#B98550" : (k > i ? "rgba(242,235,227," + (0.5 - (k - i) * 0.1) + ")" : "rgba(242,235,227,0.2)");
    return {
      cur: data[i],
      scale: (1 / sizes[i]).toFixed(3),
      f0: fc(0), f1: fc(1), f2: fc(2),
      stages: data.map((d, k) => ({ no: d.no, aria: "Stage " + d.no + ": " + d.title, active: k === i, color: k === i ? "#F2EBE3" : "rgba(242,235,227,0.65)", line: k === i ? "#B98550" : "transparent", pick: () => go(k) })),
      prev: () => go(i - 1),
      next: () => go(i + 1),
      ts: (e) => { this._x = e.touches[0].clientX; },
      te: (e) => { const dx = e.changedTouches[0].clientX - (this._x ?? 0); if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1); }
    };
  }
}
</script>
</body>
</html>
